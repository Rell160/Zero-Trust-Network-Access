#!/usr/sbin/nft -f
# ==============================================================================
# nftables Network Segmentation & Quarantine Ruleset for ZTNA Testbed
# ==============================================================================
# Target Host: gw-firewall (VM 101) & Hypervisor Gateway
# Implements:
#   - Default Deny inter-segment routing
#   - ZTNA Control Plane isolation (vmbr1: 10.10.10.0/24)
#   - Enterprise DMZ access only via PEP (vmbr2: 10.10.20.0/24)
#   - Enterprise Core DB isolation (vmbr3: 10.10.30.0/24)
#   - Dynamic Quarantine IP Set
# ==============================================================================

flush ruleset

table inet ztna_firewall {

    # Set of dynamically quarantined IPs (populated by ZTNA Controller upon CRITICAL risk)
    set quarantined_hosts {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1h
        elements = {
            198.51.100.10,
            198.51.100.20
        }
    }

    # Set of authorized PEP proxies allowed to reach enterprise VMs
    set authorized_pep_proxies {
        type ipv4_addr
        elements = {
            10.10.20.10
        }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif "lo" accept

        # Allow established and related traffic
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # Allow ICMP for diagnostic
        ip protocol icmp accept

        # Allow SSH only from management subnet
        ip saddr 192.168.1.0/24 tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # 1. IMMEDIATE QUARANTINE ENFORCEMENT
        ip saddr @quarantined_hosts counter drop
        ip daddr @quarantined_hosts counter drop

        # 2. Allow established/related connections
        ct state established,related accept

        # 3. Control Plane: PEP Proxy can query ZTNA Controller (8003), Risk Engine (8001), MFA (8002)
        ip saddr 10.10.20.10 ip daddr 10.10.10.10 tcp dport 8003 accept
        ip saddr 10.10.20.10 ip daddr 10.10.10.11 tcp dport 8001 accept
        ip saddr 10.10.20.10 ip daddr 10.10.10.12 tcp dport 8002 accept

        # 4. Monitoring scraping: Mon server (10.10.10.20) scrapes metrics
        ip saddr 10.10.10.20 tcp dport { 8000, 8001, 8002, 8003, 9090, 9100 } accept

        # 5. Enterprise DMZ VMs: Accessible ONLY through PEP Proxy
        ip saddr @authorized_pep_proxies ip daddr 10.10.20.0/24 accept

        # 6. Sensitive Core DB (10.10.30.0/24): Accessible only from allowed DMZ apps under strict PEP inspection
        ip saddr 10.10.20.102 ip daddr 10.10.30.103 tcp dport 5432 accept

        # 7. Default Deny: All other inter-VLAN forwarding dropped by chain policy
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
