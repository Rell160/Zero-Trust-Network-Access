version: "3.9"

services:
  risk-engine:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.risk_engine.app:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${RISK_ENGINE_PORT:-8001}:8001"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CONFIG_PATH=config/config.yaml
      - SERVICE_NAME=risk-engine
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ztna-net

  mfa-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.mfa_server.app:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "${MFA_SERVER_PORT:-8002}:8002"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CONFIG_PATH=config/config.yaml
      - SERVICE_NAME=mfa-server
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ztna-net

  ztna-controller:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.ztna_controller.app:app --host 0.0.0.0 --port 8003 --reload
    ports:
      - "${ZTNA_CONTROLLER_PORT:-8003}:8003"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CONFIG_PATH=config/config.yaml
      - SERVICE_NAME=ztna-controller
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ztna-net

  pep:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.pep.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${PEP_PORT:-8000}:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CONFIG_PATH=config/config.yaml
      - SERVICE_NAME=pep
    depends_on:
      - risk-engine
      - mfa-server
      - ztna-controller
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ztna-net

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - ztna-net

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ztna-net

networks:
  ztna-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
